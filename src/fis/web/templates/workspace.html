<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FBA 发票拆分工具</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6fed'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial,sans-serif' font-size='28' font-weight='700' fill='white'%3EF%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">FIS</span>
        <div>
          <h1>FBA 发票拆分工具</h1>
          <p>本机处理，数据不会上传</p>
        </div>
      </div>
      <nav aria-label="辅助功能">
        <button type="button" class="button secondary" data-drawer-open="history-drawer"
                data-fis-load="/history" data-target="history-body">历史记录</button>
        <button type="button" class="button primary" data-drawer-open="masters-drawer"
                data-fis-load="/masters" data-target="masters-body">主数据</button>
      </nav>
    </header>

    <main class="app-main">
      <section id="upload" class="upload-card" aria-labelledby="upload-heading">
        <div>
          <p class="eyebrow">开始处理</p>
          <h2 id="upload-heading">选择 FBA 清关发票</h2>
          <p>上传一个 .xlsx 文件，系统将在本机识别全部货件。</p>
        </div>
        <form id="invoice-form" action="/workspace/invoice" method="post"
              enctype="multipart/form-data">
          <label class="file-picker" for="invoice">
            <span>选择 Excel 文件</span>
            <input id="invoice" name="invoice" type="file" accept=".xlsx" required>
          </label>
          <button class="button primary" type="submit">上传并解析</button>
        </form>
        <p id="upload-status" class="status-line" role="status" aria-live="polite"></p>
      </section>

      <div id="workspace-sections"></div>
    </main>

    <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
    <aside id="history-drawer" class="drawer" aria-labelledby="history-heading" aria-hidden="true">
      <div class="drawer-header">
        <h2 id="history-heading">历史记录</h2>
        <button type="button" class="icon-button" data-drawer-close aria-label="关闭历史记录">×</button>
      </div>
      <div id="history-body" class="drawer-body"></div>
    </aside>
    <aside id="masters-drawer" class="drawer wide" aria-labelledby="masters-heading" aria-hidden="true">
      <div class="drawer-header">
        <h2 id="masters-heading">主数据</h2>
        <button type="button" class="icon-button" data-drawer-close aria-label="关闭主数据">×</button>
      </div>
      <div id="masters-body" class="drawer-body"></div>
    </aside>

    <script src="{{ url_for('static', path='/app.js') }}"></script>
  </body>
</html>
