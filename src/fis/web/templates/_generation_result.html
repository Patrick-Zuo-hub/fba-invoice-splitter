<section id="generation-result" class="generation-toast" role="status" aria-live="polite">
  <strong>已生成 1 个工作簿，共包含 {{ sheet_count }} 个货件 Sheet</strong>
  <span>{{ filename }} 已保存至 {{ output_directory }}</span>
</section>
<div id="generation-action">
  <form data-fis="post" action="/history/{{ result.batch_id }}/open-folder" method="post">
    <button class="button primary generate" type="submit">打开文件夹</button>
  </form>
</div>
