[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fba-invoice-splitter"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "lxml>=5.3,<6",
  "pillow>=11,<12",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "playwright>=1.50,<2",
  "pyinstaller>=6.11,<7",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.hatch.build]
# The repo-wide *.xlsx ignore keeps customer spreadsheets out of commits, but it
# also hides this bundled asset from Hatchling's VCS file discovery. Name it
# explicitly so the reference worksheet ships inside the wheel.
artifacts = ["src/fis/xlsx/assets/*.xlsx"]

[tool.hatch.build.targets.wheel]
packages = ["src/fis"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fis"]
# The runtime branches on sys.platform, which mypy narrows, so each platform's
# code is checked under that platform and skipped under the other. Nothing is
# pinned here: CI runs the check once per supported platform, which is the only
# way the Windows-only ctypes paths get type-checked at all.
