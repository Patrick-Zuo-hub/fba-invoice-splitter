name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Install the Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Lint
        run: python -m ruff check src tests

      - name: Type-check
        run: python -m mypy src/fis

      # Windows is the reason this workflow exists: the named-mutex, directory
      # junction and directory-handle suites are skipped on every developer
      # machine, so this is the only place they actually run.
      - name: Test
        run: python -m pytest -q -rs
